    <div class="inbox">
    <h2>Contact Path of Light Yoga Studio</h2>
    <p>Fill out the form below to contact Path of Light Yoga Studio. All information is required.</p>
    <form method="post" action="https://webdevbasics.net/scripts/yoga.php">
    <div id="form"><label for="myName">Name:</label></div>
    <div id="form"><input type="text" name="myName" id="myName" required></div>
    <div id="form"><label for="myEmail">E-mail:</label></div>
    <div id="form"><input type="email" name="myEmail" id="myEmail" required></div>
    <div id="form"><label for="myRefer">How did you hear about us?</label></div>
    <div id="form"><input type="text" name="myRefer" id="myRefer" list="referral">
    <datalist id="referral">
        <option value="Google" label="Google">
        <option value="Bing" label="Bing">
        <option value="Facebook" label="Facebook">
        <option value="Friend" label="Friend">
        <option value="Radio Ad" label="Radio Ad">
    </datalist>
    </div>
    <div id="form"><label for="myComments">Comments:</label></div>
    <div id="form"><textarea name="myComments" id="myComments" cols="20" rows="2"></textarea></div>
    <div id="form"><input type="submit" value="Send Now"></div>
    </form>
